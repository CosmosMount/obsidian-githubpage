name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-artifact@v6
        with:
          name: obsidian-githubpage-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
            packages/cli/dist/index.cjs
          if-no-files-found: error
