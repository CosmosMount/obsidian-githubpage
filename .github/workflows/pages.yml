name: Demo site GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "examples/starter-vault/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/starter-vault/package-lock.json
      - name: Install the exact published renderer
        working-directory: examples/starter-vault
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and build the demo Vault
        working-directory: examples/starter-vault
        run: npm run validate && npm run build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload pull request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: demo-site-${{ github.sha }}
          path: examples/starter-vault/_site
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/starter-vault/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy official demo site
        id: deployment
        uses: actions/deploy-pages@v4
