name: Demo site GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "examples/starter-vault/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - name: Verify the demo renderer version
        run: |
          node -e "const fs=require('fs');const demo=JSON.parse(fs.readFileSync('examples/starter-vault/.githubpage/site.json','utf8')).engineVersion;const cli=JSON.parse(fs.readFileSync('packages/cli/package.json','utf8')).version;if(demo!==cli)throw new Error(`Demo engineVersion ${demo} does not match CLI version ${cli}`)"
      - run: npm run build
      - name: Validate and build the demo Vault
        run: |
          node packages/cli/dist/index.cjs validate --root examples/starter-vault
          node packages/cli/dist/index.cjs build --root examples/starter-vault --output _site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload pull request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: demo-site-${{ github.sha }}
          path: examples/starter-vault/_site
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/starter-vault/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy official demo site
        id: deployment
        uses: actions/deploy-pages@v4
