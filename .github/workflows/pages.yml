name: Demo site GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "examples/starter-vault/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read the pinned renderer version
        id: renderer
        working-directory: examples/starter-vault
        run: |
          VERSION=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('.githubpage/site.json','utf8')).engineVersion)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Validate and build the demo Vault
        working-directory: examples/starter-vault
        env:
          ENGINE_VERSION: ${{ steps.renderer.outputs.version }}
        run: |
          npx --yes "@obsidian-githubpage/cli@${ENGINE_VERSION}" validate --root .
          npx --yes "@obsidian-githubpage/cli@${ENGINE_VERSION}" build --root . --output _site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload pull request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: demo-site-${{ github.sha }}
          path: examples/starter-vault/_site
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/starter-vault/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy official demo site
        id: deployment
        uses: actions/deploy-pages@v4
