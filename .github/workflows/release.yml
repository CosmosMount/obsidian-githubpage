name: Release plugin and CLI

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify plugin ID and release versions
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const releaseVersion = process.env.GITHUB_REF_NAME;
          const manifest = require("./manifest.json");
          const versionedFiles = [
            "package.json",
            "packages/cli/package.json",
            "packages/core/package.json",
            "packages/node-adapter/package.json",
            "packages/plugin/package.json",
          ];

          if (manifest.id !== "github-page") {
            throw new Error(`manifest.json ID must remain "github-page"; received "${manifest.id}"`);
          }
          if (manifest.version !== releaseVersion) {
            throw new Error(`manifest.json version ${manifest.version} does not match tag ${releaseVersion}`);
          }
          for (const file of versionedFiles) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (version !== releaseVersion) {
              throw new Error(`${file} version ${version} does not match tag ${releaseVersion}`);
            }
          }

          const versions = require("./versions.json");
          if (versions[releaseVersion] !== manifest.minAppVersion) {
            throw new Error("versions.json does not map this release to manifest.minAppVersion");
          }
          const starter = require("./examples/starter-vault/.githubpage/site.json");
          if (starter.engineVersion !== releaseVersion) {
            throw new Error("Starter Vault engineVersion does not match the release tag");
          }
          NODE
      - name: Validate Starter Vault before publishing
        run: |
          node packages/cli/dist/index.cjs validate --root examples/starter-vault
          node packages/cli/dist/index.cjs build --root examples/starter-vault --output _site
      - name: Publish standalone CLI
        run: npm publish ./packages/cli --access public
      - name: Pin Starter Vault to the release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const file='examples/starter-vault/.githubpage/site.json';const value=JSON.parse(fs.readFileSync(file,'utf8'));value.engineVersion=process.env.RELEASE_VERSION;fs.writeFileSync(file,JSON.stringify(value,null,2)+'\\n')"
      - name: Validate Starter Vault with the published CLI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        working-directory: examples/starter-vault
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "@obsidian-githubpage/cli@${RELEASE_VERSION}" version 2>/dev/null)" = "${RELEASE_VERSION}" ]; then break; fi
            if [ "${attempt}" = "12" ]; then echo "Published CLI was not visible in npm registry" >&2; exit 1; fi
            sleep 5
          done
          CLI_DIR="${RUNNER_TEMP}/githubpage-cli"
          mkdir -p "${CLI_DIR}"
          npm install --prefix "${CLI_DIR}" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "@obsidian-githubpage/cli@${RELEASE_VERSION}"
          node "${CLI_DIR}/node_modules/@obsidian-githubpage/cli/dist/index.cjs" validate --root .
          node "${CLI_DIR}/node_modules/@obsidian-githubpage/cli/dist/index.cjs" build --root . --output _site
      - name: Package Starter Vault download
        run: |
          cd examples/starter-vault
          zip -r ../../obsidian-githubpage-starter-vault.zip . \
            -x "_site/*" "node_modules/*" ".git/*" ".githubpage/.cache/*"
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            packages/cli/dist/index.cjs
            obsidian-githubpage-starter-vault.zip
      - name: Create Obsidian plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes main.js manifest.json styles.css obsidian-githubpage-starter-vault.zip
